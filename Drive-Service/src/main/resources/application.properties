spring.application.name=Drive-Service
server.port=8091
eureka.client.enabled=true
spring.datasource.url=jdbc:h2:file:./data/drive
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.open-in-view=false

spring.servlet.multipart.max-request-size=105MB
spring.servlet.multipart.max-file-size=100MB
spring.mvc.problemdetails.enabled=true
management.endpoints.web.exposure.include=health,info



; spring.cloud.openfeign.client.config



eureka.client.serviceUrl.defaultZone=http://localhost:8762/eureka/

drive.storage.jwt-secret=${DRIVE_STORAGE_JWT_SECRET:drive-local-storage-dev-key-change-before-production}
auth.refresh-cookie-secure=${AUTH_REFRESH_COOKIE_SECURE:false}

drive.storage.quota-bytes=${DRIVE_STORAGE_QUOTA_BYTES:5368709120}
